name: shared-postgres

services:
  postgres:
    image: postgres:${POSTGRES_VERSION}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER}
      POSTGRES_DB: ${POSTGRES_DEFAULT_DB}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin_password
      MLFLOW_DB: ${MLFLOW_DB}
      MLFLOW_DB_USER: ${MLFLOW_DB_USER}
      AIRFLOW_DB: ${AIRFLOW_DB}
      AIRFLOW_DB_USER: ${AIRFLOW_DB_USER}
      TZ: ${TZ}
      PGTZ: ${TZ}
    secrets:
      - postgres_admin_password
      - mlflow_db_password
      - airflow_db_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-app-databases.sh:/docker-entrypoint-initdb.d/10-app-databases.sh:ro
      - ./docker/init-app-databases.sh:/opt/localinfra/init-app-databases.sh:ro
    networks:
      data:
        aliases:
          - shared-postgres
    command:
      - postgres
      - -c
      - max_connections=100
      - -c
      - shared_buffers=320MB
      - -c
      - effective_cache_size=896MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - work_mem=4MB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    mem_limit: ${POSTGRES_MEMORY_LIMIT}
    cpus: ${POSTGRES_CPU_LIMIT}
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

networks:
  data:
    name: localinfra_data
    driver: bridge
    internal: true

volumes:
  postgres_data:
    name: shared_postgres_data

secrets:
  postgres_admin_password:
    file: ./secrets/postgres_admin_password
  mlflow_db_password:
    file: ./secrets/mlflow_db_password
  airflow_db_password:
    file: ./secrets/airflow_db_password
