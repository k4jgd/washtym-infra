services:
  mlflow:
    environment:
      MLFLOW_SERVER_ALLOWED_HOSTS: ${MLFLOW_VPN_IP},${MLFLOW_VPN_IP}:*,localhost,localhost:*,127.0.0.1,127.0.0.1:*
      MLFLOW_SERVER_CORS_ALLOWED_ORIGINS: http://${MLFLOW_VPN_IP},http://${MLFLOW_VPN_IP}:${MLFLOW_VPN_PORT:-5000}
    ports:
      - "${MLFLOW_VPN_IP}:${MLFLOW_VPN_PORT:-5000}:5000"
    networks:
      - backend
      - vpn_access

networks:
  vpn_access:
    name: mlflow_vpn_access
    driver: bridge
