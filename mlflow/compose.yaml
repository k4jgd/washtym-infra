name: mlflow

services:
  mlflow:
    build:
      context: .
      args:
        MLFLOW_VERSION: ${MLFLOW_VERSION}
        MLFLOW_UID: ${MLFLOW_UID}
        MLFLOW_GID: ${MLFLOW_GID}
    image: local/mlflow-server:${MLFLOW_VERSION}
    restart: unless-stopped
    environment:
      POSTGRES_HOST: shared-postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      MLFLOW_AUTH_ADMIN_USERNAME: admin
      MLFLOW_HOST: 0.0.0.0
      MLFLOW_PORT: "5000"
      MLFLOW_WORKERS: ${MLFLOW_WORKERS}
      MLFLOW_SERVER_X_FRAME_OPTIONS: DENY
      MLFLOW_SERVER_ENABLE_JOB_EXECUTION: "false"
      MLFLOW_ALLOW_PICKLE_DESERIALIZATION: "false"
      TZ: ${TZ}
    secrets:
      - postgres_password
      - mlflow_flask_secret
      - mlflow_admin_password
    volumes:
      - ./runtime:/run/mlflow-runtime:ro
    networks:
      - backend
      - data
    expose:
      - "5000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=5)"
      interval: 15s
      timeout: 7s
      retries: 20
      start_period: 30s
    read_only: true
    tmpfs:
      - /tmp:uid=${MLFLOW_UID},gid=${MLFLOW_GID},mode=1770,size=256m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: ${MLFLOW_MEMORY_LIMIT}
    cpus: ${MLFLOW_CPU_LIMIT}
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

networks:
  backend:
    internal: true
  data:
    name: localinfra_data
    external: true

secrets:
  postgres_password:
    file: ../postgres/secrets/mlflow_db_password
  mlflow_flask_secret:
    file: ./secrets/mlflow_flask_secret
  mlflow_admin_password:
    file: ./secrets/mlflow_admin_password
