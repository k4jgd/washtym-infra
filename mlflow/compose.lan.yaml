services:
  mlflow:
    environment:
      MLFLOW_SERVER_ALLOWED_HOSTS: ${MLFLOW_LAN_IP},${MLFLOW_LAN_IP}:*,localhost,localhost:*,127.0.0.1,127.0.0.1:*
      MLFLOW_SERVER_CORS_ALLOWED_ORIGINS: http://${MLFLOW_LAN_IP},http://${MLFLOW_LAN_IP}:${MLFLOW_LAN_PORT:-5000}
    ports:
      - "${MLFLOW_LAN_IP}:${MLFLOW_LAN_PORT:-5000}:5000"
    networks:
      - backend
      - lan_access

networks:
  lan_access:
    name: mlflow_lan_access
    driver: bridge

